name: Test Setup Regal

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test Setup Regal
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        version: ["<0.9", "0.10.0", "latest"]
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Regal
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Get expected version
        env:
          MATRIX_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$MATRIX_VERSION" = "<0.9" ]; then
            export EXPECTED_VERSION=v0.8.0
          elif [ "$MATRIX_VERSION" = "0.10.0" ]; then
            export EXPECTED_VERSION=v0.10.0
          else
            # get the latest version info from the github api
            export EXPECTED_VERSION=$(curl --header "authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/StyraInc/regal/releases/latest | jq -r .name )
          fi
          echo "Expected version for $MATRIX_VERSION: $EXPECTED_VERSION"
          safe=$(printf '%s' "$EXPECTED_VERSION" | tr -d '\n\r')
          echo "EXPECTED_VERSION=$safe" >> "$GITHUB_ENV"
      - name: Capture version installed
        run: |
          echo "VERSION_INSTALLED=$( regal version | head -1 | echo "v$(awk '{ print $2}')" )" >> "$GITHUB_ENV"
      - name: Verify
        shell: bash
        run: |
          if [ "$EXPECTED_VERSION" != "$VERSION_INSTALLED" ]; then
            echo "Unexpected version, expected $EXPECTED_VERSION, got: $VERSION_INSTALLED"
            exit 1;
          fi
          exit 0;

  verify-dist:
    name: Verify Dist Dir State
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: npm install

      - name: Rebuild dist (npm run prepare)
        run: npm run prepare

      - name: Verify no dist changes
        run: |

          if [ -n "$(git status dist --porcelain)" ]; then
            # Uncommitted changes
            git status dist --porcelain
            echo "::error::Uncommitted changes after npm run prepare.  Run 'npm run prepare' and commit any changes to ./dist."
            exit 1
          fi
