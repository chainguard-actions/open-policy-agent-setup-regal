name: Test regal can lint a Rego file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Run regal lint on the fixture Rego file
        run: |
          echo "Running regal lint on fixture file..."
          POLICY_FILE="$GITHUB_WORKSPACE/tests/fixtures/policy.rego"
          echo "Policy file: $POLICY_FILE"
          cat "$POLICY_FILE"
          EXIT_CODE=0
          regal lint "$POLICY_FILE" || EXIT_CODE=$?
          echo "regal lint exit code: $EXIT_CODE"
          # Exit code 0 = no violations, 1 = violations found, 2 = error
          # We only fail on exit code 2 (actual errors), not lint violations
          if [ "$EXIT_CODE" -eq 2 ]; then
            echo "FAIL: regal lint encountered an error (exit code 2)"
            exit 1
          fi
          echo "PASS: regal lint ran successfully on the Rego file (exit code: $EXIT_CODE)"
