name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          github-token: ${{ github.token }}
      - name: Assert regal is installed
        run: |
          echo "Checking regal is on PATH..."
          if ! command -v regal > /dev/null 2>&1; then
            echo "FAIL: regal not found on PATH"
            exit 1
          fi
          echo "PASS: regal found at $(command -v regal)"
      - name: Assert regal version output
        run: |
          echo "Running regal version..."
          VERSION_OUTPUT=$(regal version 2>&1 || true)
          echo "actual: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: regal version produced no output"
            exit 1
          fi
          echo "PASS: regal version output: $VERSION_OUTPUT"
